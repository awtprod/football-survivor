<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor Picks</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101311">
<style>
:root { color-scheme: dark; --bg:#101311; --card:#181c19; --card2:#1f2421; --line:#2b312d; --ink:#f2f1ec; --ink2:#b9bcb3; --muted:#7e837b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --good:#3fb872; --warn:#e0a52a; --bad:#e66767; --accent:#5aa86a; }
* { box-sizing:border-box } html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; -webkit-font-smoothing:antialiased }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)) }
header { position:sticky; top:0; z-index:5; background:rgba(16,19,17,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:10px }
header h1 { font-size:17px; margin:0; flex:1; letter-spacing:.2px } header select, header button { background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; font-size:14px }
main { padding: 12px 14px; max-width: 760px; margin: 0 auto }
.view { display:none } .view.active { display:block }
nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index:5 }
nav button { flex:1; background:none; border:0; color:var(--muted); font:inherit; font-size:11px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px } nav button.on { color:var(--accent) } nav button svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px }
.card h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600 }
.deadline { display:flex; justify-content:space-between; align-items:center; gap:8px } .deadline .big { font-size:22px; font-weight:700 } .deadline .sub { color:var(--ink2); font-size:13px }
.pill { display:inline-block; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:600; background:var(--card2); color:var(--ink2); margin:2px 4px 0 0; white-space:nowrap }
.pill.good { background:#173a25; color:#7fdc9f } .pill.warn { background:#3d2f10; color:#f0c25a } .pill.bad { background:#3f1c1c; color:#f2a0a0 } .pill.info { background:#1b2a3f; color:#8fbcf5 }
.row { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line) } .row:first-of-type { border-top:0 }
.row.used { opacity:.42 } .row img { width:34px; height:34px; flex:none } .row .body { flex:1; min-width:0 } .row .title { font-weight:600 } .row .title small { margin-left:4px } .row .title small { color:var(--muted); font-weight:400 }
.row .meta { font-size:12px; color:var(--ink2); margin-top:2px }
.prob { text-align:right; flex:none; width:64px } .prob b { font-size:19px; display:block } .prob span { font-size:11px; color:var(--muted) }
.bar { height:4px; background:var(--card2); border-radius:2px; margin-top:6px; overflow:hidden } .bar i { display:block; height:100%; background:var(--s1); border-radius:2px }
button.pick { background:var(--accent); color:#08120b; border:0; border-radius:10px; padding:8px 12px; font:inherit; font-weight:700; font-size:13px } button.pick.on { background:var(--card2); color:var(--ink); border:1px solid var(--accent) } button.pick:disabled { opacity:.35 }
.btn { background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font:inherit; font-size:14px } .btn.primary { background:var(--accent); color:#08120b; border-color:transparent; font-weight:700 }
.detail { background:var(--card2); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:13px; color:var(--ink2) } .detail dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:6px 0 0 } .detail dt { color:var(--muted) } .detail dd { margin:0 }
table { width:100%; border-collapse:collapse; font-size:13px } th, td { text-align:left; padding:7px 6px; border-top:1px solid var(--line) } th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-top:0 } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums }
.legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--ink2); margin-top:6px } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px }
svg.chart { width:100%; height:auto; display:block; touch-action:pan-y } .tip { position:fixed; pointer-events:none; background:#000c; color:#fff; font-size:12px; padding:6px 8px; border-radius:6px; z-index:9; display:none; white-space:nowrap }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:6px } .cell { background:var(--card2); border-radius:8px; padding:7px 8px; font-size:12px; text-align:center } .cell b { display:block; font-size:14px } .cell.win { box-shadow:inset 0 0 0 1.5px var(--good) } .cell.loss { box-shadow:inset 0 0 0 1.5px var(--bad) } .cell.pending { box-shadow:inset 0 0 0 1.5px var(--s4) }
.heat { display:grid; gap:2px; font-size:10px } .heat .h { display:contents } .heat .t { position:sticky; left:0; background:var(--card); font-weight:600; padding:2px 4px } .heat .c { border-radius:3px; text-align:center; padding:3px 0; color:#0b0b0b; font-weight:600; min-width:26px } .heat .c.u { outline:2px solid var(--ink); outline-offset:-2px }
.heatwrap { overflow-x:auto; -webkit-overflow-scrolling:touch }
label.f { display:block; margin:8px 0; font-size:14px } label.f select, label.f input { width:100%; margin-top:4px; background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit }
.note { color:var(--muted); font-size:12px } .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#000d; color:#fff; padding:10px 14px; border-radius:10px; font-size:13px; z-index:20; display:none }
.ev { font-weight:700 } .ev.up { color:var(--good) } .ev.dn { color:var(--bad) }
th.s { cursor:pointer; user-select:none } th.s.on { color:var(--ink) }
textarea.paste { width:100%; min-height:110px; background:var(--card2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px; font:12px/1.4 ui-monospace,Menlo,monospace; margin-top:6px }
input[type=range] { width:100%; margin:8px 0 } .stat { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2) } .stat b { color:var(--ink); font-size:15px; display:block }
.est { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--warn); border:1px solid var(--warn); border-radius:4px; padding:0 5px; margin-left:6px; vertical-align:2px }
.empty { color:var(--muted); text-align:center; padding:24px 0 }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px } .chips button { background:var(--card2); border:1px solid var(--line); color:var(--ink2); border-radius:999px; padding:5px 11px; font:inherit; font-size:12px } .chips button.on { border-color:var(--accent); color:var(--ink) }
</style>
</head>
<body data-palette="#3987e5,#d95926,#199e70,#c98500">
<header><h1 id="hdr">Survivor</h1><select id="weekSel" aria-label="Week"></select><button id="refresh" title="Refresh data">↻</button></header>
<main>
  <section id="v-pick" class="view active"></section>
  <section id="v-pool" class="view"></section>
  <section id="v-season" class="view"></section>
  <section id="v-trends" class="view"></section>
  <section id="v-settings" class="view"></section>
</main>
<nav>
  <button data-v="pick" class="on"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Pick</button>
  <button data-v="pool"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M15 14.5a5 5 0 0 1 6.5 4.5"/></svg>Pool</button>
  <button data-v="season"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Season</button>
  <button data-v="trends"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Trends</button>
  <button data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div class="tip" id="tip"></div><div class="toast" id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
